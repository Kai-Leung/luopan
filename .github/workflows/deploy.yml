name: Deploy Compass Backend

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: compass-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 82.156.128.251
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /root/compass
            git pull --ff-only origin main
            systemctl restart compass-backend
            systemctl is-active --quiet compass-backend

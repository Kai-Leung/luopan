name: Deploy Compass

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Commit SHA that passed CI
        required: true
        type: string
    secrets:
      SERVER_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Commit SHA to deploy (defaults to the selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment SHA
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="${{ inputs.deploy_sha || github.sha }}"
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA" >&2
            exit 1
          fi
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $deploy_sha"

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 82.156.128.251
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -euo pipefail
            deploy_sha="${{ steps.deployment.outputs.sha }}"
            cd /root/compass

            if [[ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" != "true" ]]; then
              echo "Deployment blocked: /root/compass is not a Git worktree" >&2
              exit 1
            fi
            if ! origin_url="$(git remote get-url origin 2>/dev/null)"; then
              echo "Deployment blocked: origin remote is missing" >&2
              exit 1
            fi
            case "$origin_url" in
              git@github.com:Kai-Leung/luopan.git|https://github.com/Kai-Leung/luopan.git)
                ;;
              *)
                echo "Deployment blocked: origin does not match Kai-Leung/luopan" >&2
                exit 1
                ;;
            esac
            if ! git diff --quiet; then
              echo "Deployment blocked: tracked working-tree changes exist" >&2
              exit 1
            fi
            if ! git diff --cached --quiet; then
              echo "Deployment blocked: staged changes exist" >&2
              exit 1
            fi
            if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
              echo "Deployment blocked: untracked files exist" >&2
              exit 1
            fi

            git fetch --no-tags origin main
            git cat-file -e "${deploy_sha}^{commit}"
            git merge-base --is-ancestor "$deploy_sha" origin/main
            git checkout main
            git merge-base --is-ancestor HEAD "$deploy_sha"
            git merge --ff-only "$deploy_sha"
            actual_sha="$(git rev-parse HEAD)"
            if [[ "$actual_sha" != "$deploy_sha" ]]; then
              echo "Deployment blocked: HEAD $actual_sha does not match target $deploy_sha" >&2
              exit 1
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Deployment blocked: tracked changes appeared after update" >&2
              exit 1
            fi
            if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
              echo "Deployment blocked: untracked files appeared after update" >&2
              exit 1
            fi

            systemctl restart compass-backend
            health="$(curl --fail --silent --show-error http://127.0.0.1:8000/health)"
            python3 - "$health" <<'PY'
            import json
            import sys

            payload = json.loads(sys.argv[1])
            if payload.get("status") != "ok" or payload.get("service") != "Compass":
                raise SystemExit(f"unexpected health response: {payload}")
            PY
            echo "Deployed commit $deploy_sha"

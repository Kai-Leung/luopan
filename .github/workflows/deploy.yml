name: Deploy Compass

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'apps/h5/**'
      - 'apps/pc/**'
      - 'packages/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 82.156.128.251
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/compass
            git pull origin main
            systemctl restart compass-backend

name: Deploy Compass Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 82.156.128.251
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            APP_DIR="/root/compass/01_arch_dir/compass/services/api"
            WEB_DIR="/www/wwwroot/82.156.128.251"

            echo "=== 1. Pull latest code ==="
            cd /root/compass
            git pull origin main

            echo ""
            echo "=== 2. Setup venv if needed ==="
            if [ ! -d "$APP_DIR/.venv" ]; then
              /usr/bin/python3.12 -m venv "$APP_DIR/.venv"
            fi

            echo ""
            echo "=== 3. Install/update Python dependencies ==="
            source "$APP_DIR/.venv/bin/activate"
            pip install --upgrade pip -q
            pip install uvicorn fastapi sqlalchemy pydantic aiosqlite -q

            echo ""
            echo "=== 4. Build frontend ==="
            cd /root/compass/01_arch_dir/compass/apps/h5
            if [ -f node_modules/.package-lock.json ]; then
              npm run build
            else
              echo "No node_modules, skip frontend build"
            fi

            echo ""
            echo "=== 5. Deploy frontend dist ==="
            if [ -d dist ]; then
              rm -rf "$WEB_DIR"/*
              cp -r dist/* "$WEB_DIR/"
              chown -R www:www "$WEB_DIR" 2>/dev/null || true
            fi

            echo ""
            echo "=== 6. Create data dir if needed ==="
            mkdir -p /root/compass/01_arch_dir/compass/data/dev

            echo ""
            echo "=== 7. Write .env if missing ==="
            if [ ! -f "$APP_DIR/.env" ]; then
              echo 'DATABASE_URL=sqlite:///./data/dev/compass_dev.sqlite3' > "$APP_DIR/.env"
            fi

            echo ""
            echo "=== 8. Restart backend service ==="
            systemctl daemon-reload
            systemctl restart compass-backend

            echo ""
            echo "=== 9. Verify deployment ==="
            sleep 3
            curl -s http://127.0.0.1:8000/api/v1/l3/facts
            echo ""
            echo "Deploy completed."

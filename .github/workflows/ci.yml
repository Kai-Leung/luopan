name: Repository CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "工作记录及报告/**"
      - "**/*.md"

  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "工作记录及报告/**"
      - "**/*.md"

concurrency:
  group: repository-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-and-contracts:
    name: Frontend and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Run TypeScript and contract checks
        run: npm run check

      - name: Build H5
        run: npm run build --workspace @compass/h5

      - name: Build PC
        run: npm run build --workspace @compass/pc

      - name: Verify no nested lockfiles
        run: |
          set -e
          nested_locks=$(find apps packages -mindepth 2 -name package-lock.json -print)
          if [ -n "$nested_locks" ]; then
            echo "Nested package-lock.json files are not allowed:"
            echo "$nested_locks"
            exit 1
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements.txt

      - name: Run backend tests
        working-directory: services/api
        run: python -m pytest -q

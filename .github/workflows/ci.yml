name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository policy
        run: python3 scripts/check/repository_policy.py
      - name: Test runtime change detection
        run: python3 -m unittest scripts.check.tests.test_runtime_changes

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run check:frontend
      - name: Test H5
        run: npm test --workspace @compass/h5
      - name: Test PC
        run: npm test --workspace @compass/pc
      - name: Build H5
        run: npm run build --workspace @compass/h5
      - name: Build PC
        run: npm run build --workspace @compass/pc

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: npm ci
      - run: python3 -m pip install -r services/api/requirements.txt
      - name: Check contracts
        run: python3 scripts/check/contracts_consistency.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install backend dependencies
        run: python3 -m pip install -r services/api/requirements.txt
      - name: Check backend dependencies
        run: python3 -m pip check
      - name: Run backend tests
        working-directory: services/api
        run: python3 -m pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: python3 -m pip install -r services/api/requirements.txt
      - name: Run integration acceptance tests
        working-directory: services/api
        run: python3 -m pytest tests/integration -q

  detect-runtime-changes:
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.changes.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: changes
        name: Detect runtime changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          python3 scripts/check/runtime_changes.py \
            --base "$base_sha" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

  deploy-production:
    needs:
      - repository-policy
      - frontend
      - contracts
      - backend
      - integration
      - detect-runtime-changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.repository-policy.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.contracts.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_sha: ${{ github.sha }}
    secrets: inherit
